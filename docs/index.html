<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>語音速記</title>
<meta name="theme-color" content="#1f6feb">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="語音速記">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #6a737d;
    --accent: #1f6feb; --rec: #e5484d; --ok: #2da44e; --border: #d8dee4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #8b949e;
      --accent: #4493f8; --rec: #f85149; --ok: #3fb950; --border: #30363d;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 20px; margin: 8px 0; }
  .icon-btn { background: none; border: none; font-size: 22px; color: var(--muted); padding: 8px; cursor: pointer; }
  .tabs { display: flex; gap: 8px; margin: 8px 0 16px; }
  .tabs button { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: 15px; cursor: pointer; }
  .tabs button.active { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .rec-wrap { display: flex; flex-direction: column; align-items: center; padding: 24px 0 8px; }
  #recBtn { width: 160px; height: 160px; border-radius: 50%; border: none; background: var(--accent);
    color: #fff; font-size: 56px; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.18);
    transition: transform .1s, background .2s; -webkit-tap-highlight-color: transparent; }
  #recBtn:active { transform: scale(.96); }
  #recBtn.recording { background: var(--rec); animation: pulse 1.4s infinite; }
  #recBtn:disabled { opacity: .5; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(229,72,77,.5); } 50% { box-shadow: 0 0 0 18px rgba(229,72,77,0); } }
  #timer { font-variant-numeric: tabular-nums; font-size: 28px; margin-top: 16px; }
  .hint { color: var(--muted); font-size: 14px; text-align: center; margin-top: 6px; }
  textarea { width: 100%; min-height: 180px; font-size: 17px; padding: 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); resize: vertical; font-family: inherit; }
  input[type=text], input[type=password] { width: 100%; font-size: 16px; padding: 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  label { display: block; font-size: 14px; color: var(--muted); margin: 12px 0 4px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; }
  .primary { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 12px 20px;
    font-size: 16px; cursor: pointer; }
  .primary:disabled { opacity: .5; }
  .check { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; margin: 0; }
  #status { min-height: 24px; text-align: center; font-size: 15px; margin: 4px 0 12px; }
  #status.ok { color: var(--ok); } #status.err { color: var(--rec); }
  #result { white-space: pre-wrap; font-size: 15px; line-height: 1.6; }
  #result h3 { margin: 0 0 8px; font-size: 17px; }
  .list { list-style: none; padding: 0; margin: 0; }
  .list li { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .list li:last-child { border-bottom: none; }
  .list .meta { color: var(--muted); font-size: 12px; }
  h2 { font-size: 15px; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  .hidden { display: none !important; }
  #queueInfo { color: var(--muted); font-size: 13px; text-align: center; }
  #queueInfo button { font-size: 13px; margin-left: 6px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>💡 語音速記</h1>
    <button class="icon-btn" id="settingsBtn" aria-label="設定">⚙️</button>
  </header>

  <section id="settings" class="card hidden">
    <h2>連線設定（每台裝置設定一次）</h2>
    <label for="urlInput">Apps Script 網址</label>
    <input type="text" id="urlInput" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
    <label for="tokenInput">通關密語（TOKEN）</label>
    <input type="password" id="tokenInput" autocomplete="off">
    <label for="deviceInput">裝置名稱</label>
    <input type="text" id="deviceInput" placeholder="例如 Galaxy S25 / iPad / Mac">
    <div class="row">
      <button class="primary" id="testBtn">測試連線</button>
      <button class="primary" id="saveSettingsBtn">儲存</button>
    </div>
  </section>

  <div class="tabs" role="tablist">
    <button id="tabVoice" class="active" role="tab">🎙️ 錄音</button>
    <button id="tabText" role="tab">⌨️ 打字／鍵盤聽寫</button>
  </div>

  <section id="voicePane" class="card">
    <div class="rec-wrap">
      <button id="recBtn" aria-label="開始錄音">🎙️</button>
      <div id="timer">0:00</div>
      <div class="hint" id="recHint">按一下開始講，再按一下結束（最長 5 分鐘）</div>
    </div>
  </section>

  <section id="textPane" class="card hidden">
    <textarea id="textInput" placeholder="可以直接打字，也可以按鍵盤上的麥克風用說的"></textarea>
    <div class="row">
      <label class="check"><input type="checkbox" id="cleanCheck" checked> AI 整理</label>
      <button class="primary" id="saveTextBtn">存檔</button>
    </div>
  </section>

  <div id="status"></div>
  <div id="queueInfo"></div>

  <section id="resultCard" class="card hidden">
    <div id="result"></div>
  </section>

  <section class="card">
    <h2>最近存檔</h2>
    <ul class="list" id="history"><li class="meta">還沒有紀錄</li></ul>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
